// Tile fill. Dark uses the tactic's own deep tint; classic washes the same hue
// over white so the category stays recognisable without darkening the page.
let CLASSIC = false;  // set during render by ATLASMatrix; see note there
const tileFill = color => (CLASSIC ? color.border + "14" : color.bg);

// The tactic and status palettes are tuned for a dark page. On white the
// brighter hues collapse: yellow and lime read at ~1.8:1 as text, and a 20%
// border tint of amber or green sits at ~1.07:1 and disappears entirely, which
// is why only the red "real incident" chips looked outlined.
//
// Both are fixed by pulling the same hue down until it clears contrast, never
// by changing the hue itself, so a category stays recognisably its own colour.
// Text and borders use different targets on purpose: text needs to be dark,
// while a border only needs to be seen. Darkening borders as hard as text made
// amber edges heavier than red ones, which inverted the meaning.
const darken = (hex, target) => {
  if (!CLASSIC || !/^#[0-9a-f]{6}$/i.test(hex)) return hex;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const l = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  if (l > target) {
    const k = target / l;
    r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
  }
  return "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
};

// Inflate the embedded dataset. DecompressionStream is native in current
// browsers and works from file://, so the page stays a single self-contained
// document with no build step and no network fetch at runtime. The readable
// source of this payload lives in data/ and its SHA-256 is in ATLAS_PROVENANCE.
async function loadAtlasData() {
  const bin = atob(ATLAS_PAYLOAD_GZ);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Response(bytes).body.pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

// ATLAS descriptions are multi-paragraph markdown with cross-reference links.
// build_data.py has already rewritten the relative ones to absolute URLs, so
// this only has to turn [text](url) into anchors and paragraphs into <p>.
function RichText({ text, color, style }) {
  const linkRe = /\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
  return text.split(/\n\s*\n/).map((para, pi) => {
    const flat = para.replace(/\n/g, " ").trim();
    if (!flat) return null;
    const parts = [];
    let last = 0, m;
    linkRe.lastIndex = 0;
    while ((m = linkRe.exec(flat)) !== null) {
      if (m.index > last) parts.push(flat.slice(last, m.index));
      parts.push(
        <a key={m.index} href={m[2]} target="_blank" rel="noopener noreferrer"
          style={{ color, textDecoration: "none", borderBottom: `1px dotted ${color}66` }}>{m[1]}</a>
      );
      last = m.index + m[0].length;
    }
    if (last < flat.length) parts.push(flat.slice(last));
    return <p key={pi} style={{ margin: pi === 0 ? "5px 0 8px" : "0 0 8px", ...style }}>{parts}</p>;
  });
}

function extractJSON(text) {
  // Remove markdown fences and extract JSON block
  let clean = text.replace(/```json|```/g, "").trim();
  // Walk to the first balanced {...}, ignoring braces inside strings. A greedy
  // match to the last "}" over-captures when the model appends prose containing
  // a brace, or emits a second object after the first.
  const start = clean.indexOf("{");
  if (start !== -1) {
    let depth = 0, inStr = false, esc = false;
    for (let i = start; i < clean.length; i++) {
      const c = clean[i];
      if (esc) { esc = false; continue; }
      if (c === "\\") { esc = true; continue; }
      if (c === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === "{") depth++;
      else if (c === "}" && --depth === 0) { clean = clean.slice(start, i + 1); break; }
    }
    // If depth never closed the response was truncated; leave `clean` alone so
    // JSON.parse throws and the "cut off" branch below gives the useful advice.
  }
  try {
    return JSON.parse(clean);
  } catch (e) {
    if (e.message.includes("Unexpected end") || e.message.includes("Unterminated")) {
      throw new Error("The model's response was cut off before finishing. Open ⚙ Settings → Advanced Tuning → increase Num Predict to 4000 or higher, then try again.");
    }
    throw new Error(`Failed to parse model response as JSON: ${e.message}. The model may not have followed the JSON format. Try a different model or retry.`);
  }
}

async function runSimulation(tech, allTechs, tactics, config, mitigations = [], selectedTacticId = null) {
  const { provider, apiKey, ollamaUrl, ollamaModel, cloudModel } = config;
  // Use few-shot enriched prompt only for Ollama (smaller local models benefit hugely)
  // Claude and GPT already know ATLAS well enough without examples
  const prompt = buildPrompt(tech, allTechs, tactics, provider === "ollama", mitigations, selectedTacticId);

  if (provider === "anthropic") {
    if (!apiKey) throw new Error("Anthropic API key required. Open settings (⚙) to add it.");
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: cloudModel || "claude-sonnet-4-5",
        max_tokens: 1500,
        messages: [{ role: "user", content: prompt }],
      }),
    });
    if (!r.ok) {
      const err = await r.text();
      if (r.status === 401) throw new Error("Anthropic: Invalid API key. Check your key in settings (⚙). Make sure it starts with 'sk-ant-'.");
      if (r.status === 429) throw new Error("Anthropic: Rate limit exceeded. Wait a moment and try again.");
      if (r.status === 404) throw new Error(`Anthropic: Model "${cloudModel}" not found. Try a different model in settings (⚙).`);
      throw new Error(`Anthropic API error (${r.status}): ${err.slice(0, 200)}`);
    }
    const data = await r.json();
    const text = data.content?.map(i => i.text || "").join("") || "";
    return extractJSON(text);
  }

  if (provider === "openai") {
    if (!apiKey) throw new Error("OpenAI API key required. Open settings (⚙) to add it.");
    const model = cloudModel || "gpt-4o-mini";
    // Newer models (o1, o3, gpt-4o, chatgpt-4o) use max_completion_tokens; older use max_tokens
    const isReasoning = /^(o1|o3)/.test(model);
    const usesNewTokenParam = /^(o1|o3|gpt-4o|chatgpt-4o)/.test(model);
    const body = {
      model,
      messages: [{ role: "user", content: prompt }],
    };
    // Apply the correct token limit parameter
    if (usesNewTokenParam) {
      body.max_completion_tokens = 1500;
    } else {
      body.max_tokens = 1500;
    }
    if (!isReasoning) body.response_format = { type: "json_object" };
    const r = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
      },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.text();
      if (r.status === 401) throw new Error("OpenAI: Invalid API key. Check your key in settings (⚙).");
      if (r.status === 429) throw new Error("OpenAI: Rate limit exceeded. Wait a moment and try again.");
      if (r.status === 404) throw new Error(`OpenAI: Model "${model}" not found. You may not have access to it. Try a different model in settings (⚙).`);
      throw new Error(`OpenAI API error (${r.status}): ${err.slice(0, 200)}`);
    }
    const data = await r.json();
    const text = data.choices?.[0]?.message?.content || "";
    return extractJSON(text);
  }

  if (provider === "gemini") {
    if (!apiKey) throw new Error("Google Gemini API key required. Open settings (⚙) to add it.");
    const model = cloudModel || DEFAULT_CLOUD_MODEL.gemini;
    // The key goes in the x-goog-api-key header rather than the ?key= query
    // parameter Google's quickstart shows, because query strings leak into history,
    // proxy logs and referrers, and this is a credential.
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: { responseMimeType: "application/json", maxOutputTokens: 2000 },
      }),
    });
    if (!r.ok) {
      const err = await r.text();
      if (r.status === 400 && /API key not valid/i.test(err)) throw new Error("Gemini: Invalid API key. Check your key in settings (⚙).");
      if (r.status === 401 || r.status === 403) throw new Error("Gemini: Key rejected. Check the key and that the Generative Language API is enabled for it.");
      if (r.status === 429) throw new Error("Gemini: Rate limit exceeded. Wait a moment and try again.");
      if (r.status === 404) throw new Error(`Gemini: Model "${model}" not found. Try a different model in settings (⚙).`);
      throw new Error(`Gemini API error (${r.status}): ${err.slice(0, 200)}`);
    }
    const data = await r.json();
    const cand = data.candidates?.[0];
    // A safety block returns no parts at all, which would otherwise surface as
    // an unhelpful JSON parse failure.
    if (!cand || (!cand.content?.parts && cand.finishReason)) {
      throw new Error(`Gemini returned no content (finishReason: ${cand?.finishReason || "unknown"}). Try a different model or rephrase.`);
    }
    const text = (cand.content?.parts || []).map(p => p.text || "").join("");
    return extractJSON(text);
  }

  if (provider === "ollama") {
    const url = (ollamaUrl || "http://localhost:11434").replace(/\/$/, "");
    const model = ollamaModel || "llama3.2";
    const r = await fetch(`${url}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model,
        messages: [{ role: "user", content: prompt }],
        stream: false,
        format: "json",
        options: {
          temperature: config.temperature ?? 0.6,
          top_p: config.topP ?? 0.9,
          num_ctx: config.numCtx ?? 8192,
          num_predict: config.numPredict ?? 2000,
        },
      }),
    });
    if (!r.ok) {
      throw new Error(`Ollama error (${r.status}). Is Ollama running at ${url}?`);
    }
    const data = await r.json();
    const text = data.message?.content || "";
    return extractJSON(text);
  }

  throw new Error("No AI provider configured. Click ⚙ to set up.");
}

// Ollama runs on plain http at localhost, which the browser will refuse to
// reach from some contexts no matter how Ollama itself is configured. Rather
// than report a generic "cannot connect", work out which context this is.
function ollamaEnvironmentIssue(ollamaUrl) {
  const proto = location.protocol;
  const url = (ollamaUrl || "").trim();
  const targetIsHttp = /^http:\/\//i.test(url);
  let host = "";
  try { host = new URL(url).hostname.toLowerCase(); } catch (e) { /* malformed url */ }
  // Loopback is a "potentially trustworthy origin" per the Secure Contexts spec,
  // so browsers exempt it from mixed-content blocking. An HTTPS page CAN reach
  // http://localhost. Only a non-loopback plain-HTTP host is actually blocked.
  const isLoopback = host === "localhost" || host === "127.0.0.1" || host === "[::1]"
    || host === "::1" || host.endsWith(".localhost");

  if (proto === "https:" && targetIsHttp && !isLoopback) {
    return {
      blocking: true,
      title: "Blocked: HTTPS page cannot reach a plain-HTTP host",
      msg: "This page is served over HTTPS, so the browser blocks plain-HTTP requests to "
        + (host || "that address") + " as mixed content. Loopback is exempt from that rule, so "
        + "point this at http://localhost:11434 or http://127.0.0.1:11434 and it will work, "
        + "or serve the matrix itself over http://.",
    };
  }
  if (proto === "file:") {
    return {
      blocking: false,
      title: "Opened directly from disk (file://)",
      msg: "Requests from a file:// page carry “Origin: null”, so Ollama must be started with OLLAMA_ORIGINS=\"*\" to accept them, and some browsers refuse regardless. Serving the folder over http://localhost is the reliable setup. See “Local HTTP server” in the README.",
    };
  }
  return null;
}

const isCloud = p => Object.prototype.hasOwnProperty.call(CLOUD_PROVIDERS, p);
const providerLabel = p => (CLOUD_PROVIDERS[p] ? CLOUD_PROVIDERS[p].label : p === "ollama" ? "Ollama" : "None");

// Derived views kept so the rest of the component reads unchanged.
const FALLBACK_CLOUD_MODELS = Object.fromEntries(
  Object.entries(CLOUD_PROVIDERS).map(([k, v]) => [k, v.fallback]));
const DEFAULT_CLOUD_MODEL = Object.fromEntries(
  Object.entries(CLOUD_PROVIDERS).map(([k, v]) => [k, v.default]));

function SettingsModal({ config, setConfig, onClose }) {
  const [provider, setProvider] = useState(config.provider || "none");
  const [apiKey, setApiKey] = useState(config.apiKey || "");
  const [ollamaUrl, setOllamaUrl] = useState(config.ollamaUrl || "http://localhost:11434");
  const [ollamaModel, setOllamaModel] = useState(config.ollamaModel || "llama3.2");
  const [cloudModel, setCloudModel] = useState(
    config.cloudModel || DEFAULT_CLOUD_MODEL[config.provider] || DEFAULT_CLOUD_MODEL.anthropic
  );
  const [showKey, setShowKey] = useState(false);

  // Advanced tuning (Ollama only)
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [temperature, setTemperature] = useState(config.temperature ?? OLLAMA_DEFAULTS.temperature);
  const [topP, setTopP] = useState(config.topP ?? OLLAMA_DEFAULTS.topP);
  const [numCtx, setNumCtx] = useState(config.numCtx ?? OLLAMA_DEFAULTS.numCtx);
  const [numPredict, setNumPredict] = useState(config.numPredict ?? OLLAMA_DEFAULTS.numPredict);

  // Dynamic model list fetching (Ollama)
  const [availableModels, setAvailableModels] = useState(null);
  const [loadingModels, setLoadingModels] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const [testing, setTesting] = useState(false);

  // Dynamic cloud model fetching
  const [cloudModels, setCloudModels] = useState(null); // null=not fetched, []=fallback
  const [cloudFetching, setCloudFetching] = useState(false);
  const [cloudFetchResult, setCloudFetchResult] = useState(null);

  // When the provider switches, move to that provider's default model, unless
  // we are switching back to the one already saved, in which case restore the
  // saved choice. Carrying the previous provider's model across would send an
  // id like "claude-sonnet-4-5" to Gemini and 404.
  useEffect(() => {
    if (isCloud(provider)) {
      setCloudModel(
        config.provider === provider && config.cloudModel
          ? config.cloudModel
          : CLOUD_PROVIDERS[provider].default
      );
    }
    setCloudModels(null);
    setCloudFetchResult(null);
  }, [provider]);

  const fetchCloudModels = useCallback(async () => {
    if (!apiKey) {
      setCloudFetchResult({ ok: false, msg: "Enter your API key first." });
      return;
    }
    setCloudFetching(true);
    setCloudFetchResult(null);
    try {
      let models = [];
      if (provider === "anthropic") {
        const r = await fetch("https://api.anthropic.com/v1/models", {
          headers: {
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true",
          },
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        models = (data.data || [])
          .map(m => m.id)
          .filter(id => id && !id.includes("embedding"))
          .sort();
      } else if (provider === "openai") {
        const r = await fetch("https://api.openai.com/v1/models", {
          headers: { "Authorization": `Bearer ${apiKey}` },
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        // Filter to chat-capable models only (gpt-*, o1-*, o3-*, chatgpt-*)
        models = (data.data || [])
          .map(m => m.id)
          .filter(id => id && /^(gpt-|o1-|o3-|chatgpt-)/.test(id))
          .filter(id => !/embedding|whisper|tts|dall-e|davinci|babbage|moderation|realtime|audio|transcribe/.test(id))
          .sort();
      } else if (provider === "gemini") {
        const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", {
          headers: { "x-goog-api-key": apiKey },
        });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        // Names come back as "models/gemini-x.y-flash"; keep only those that can
        // actually answer a generateContent call.
        models = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
          .map(m => (m.name || "").replace(/^models\//, ""))
          .filter(id => id && !/embedding|aqa|imagen|veo|tts/.test(id))
          .sort();
      }

      if (models.length === 0) {
        setCloudModels(FALLBACK_CLOUD_MODELS[provider]);
        setCloudFetchResult({ ok: true, msg: `No chat models returned. Showing common defaults.` });
      } else {
        setCloudModels(models);
        setCloudFetchResult({ ok: true, msg: `Loaded ${models.length} available model${models.length !== 1 ? "s" : ""} from ${providerLabel(provider)}.` });
      }
    } catch (e) {
      setCloudModels(FALLBACK_CLOUD_MODELS[provider]);
      setCloudFetchResult({ ok: false, msg: `Could not fetch models (${e.message}). Showing common defaults, your key still works.` });
    }
    setCloudFetching(false);
  }, [provider, apiKey]);

  const fetchModels = useCallback(async () => {
    setLoadingModels(true);
    setTestResult(null);
    try {
      const url = (ollamaUrl || "http://localhost:11434").replace(/\/$/, "");
      const r = await fetch(`${url}/api/tags`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      const models = (data.models || []).map(m => m.name || m.model).filter(Boolean);
      setAvailableModels(models);
      if (models.length > 0 && !models.includes(ollamaModel)) {
        setTestResult({ ok: true, msg: `Found ${models.length} model${models.length !== 1 ? "s" : ""}. Current "${ollamaModel}" not installed. Pick one from the dropdown.` });
      } else {
        setTestResult({ ok: true, msg: `Connected. ${models.length} model${models.length !== 1 ? "s" : ""} installed.` });
      }
    } catch (e) {
      setAvailableModels([]);
      // A failure here is nearly always one of three things, and the page's own
      // protocol tells us which, so say which rather than listing all three.
      const env = ollamaEnvironmentIssue(ollamaUrl);
      setTestResult({
        ok: false,
        msg: env
          ? `Cannot reach Ollama at ${ollamaUrl}. ${env.title}. ${env.msg}`
          : `Cannot reach Ollama at ${ollamaUrl}. Check that it is running (open ${ollamaUrl} in a tab, you should see "Ollama is running"), and that it was started with OLLAMA_ORIGINS="*" so the browser is allowed to call it.`,
      });
    }
    setLoadingModels(false);
  }, [ollamaUrl, ollamaModel]);

  const testConnection = useCallback(async () => {
    setTesting(true);
    await fetchModels();
    setTesting(false);
  }, [fetchModels]);

  const resetTuning = () => {
    setTemperature(OLLAMA_DEFAULTS.temperature);
    setTopP(OLLAMA_DEFAULTS.topP);
    setNumCtx(OLLAMA_DEFAULTS.numCtx);
    setNumPredict(OLLAMA_DEFAULTS.numPredict);
  };

  const save = () => {
    const newConfig = { provider, apiKey, ollamaUrl, ollamaModel, cloudModel, temperature, topP, numCtx, numPredict };
    setConfig(newConfig);
    try {
      localStorage.setItem("atlas_sim_config", JSON.stringify(newConfig));
    } catch (e) { console.warn("localStorage unavailable"); }
    onClose();
  };

  const clearAll = () => {
    if (!confirm("Clear all saved settings including API keys?")) return;
    try { localStorage.removeItem("atlas_sim_config"); } catch (e) {}
    const fresh = { provider: "none", apiKey: "", ollamaUrl: "http://localhost:11434", ollamaModel: "llama3.2", cloudModel: DEFAULT_CLOUD_MODEL.anthropic, ...OLLAMA_DEFAULTS };
    setConfig(fresh);
    setProvider("none"); setApiKey(""); setOllamaUrl("http://localhost:11434"); setOllamaModel("llama3.2");
    setCloudModel(DEFAULT_CLOUD_MODEL.anthropic);
    resetTuning();
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "var(--scrim)", backdropFilter: "blur(3px)", zIndex: 2000, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, backdropFilter: "blur(6px)", animation: "fadeIn 0.2s ease" }}
      onClick={onClose}>
      <div onClick={e => e.stopPropagation()}
        style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 10, padding: "20px 22px", maxWidth: 520, width: "100%", maxHeight: "90vh", overflowY: "auto", boxShadow: "0 20px 60px rgba(0,0,0,0.6)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontSize: 18 }}>⚙</span>
            <h2 style={{ fontSize: 16, fontWeight: 700, color: "var(--strong)", margin: 0, letterSpacing: -0.3 }}>AI Simulation Settings</h2>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "1px solid var(--border3)", color: "var(--dim)", fontSize: 16, cursor: "pointer", borderRadius: 5, width: 28, height: 28 }}>✕</button>
        </div>

        <p style={{ fontSize: 11.5, color: "var(--dim)", lineHeight: 1.5, marginBottom: 14 }}>
          Choose how Attack Simulations are powered. The matrix itself works without any AI. The simulate button needs one of these.
        </p>

        {/* Provider Selection */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 9, color: "var(--dim)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>Provider</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 6 }}>
            {[
              { id: "none", label: "📖 None (matrix only)", desc: "Explore the data, no AI" },
              { id: "ollama", label: "🦙 Local Ollama", desc: "Free, offline, private" },
              { id: "anthropic", label: "🤖 Claude (your key)", desc: "Best quality, you pay" },
              { id: "openai", label: "💠 OpenAI (your key)", desc: "GPT-4o-mini, you pay" },
              { id: "gemini", label: "✦ Google Gemini (your key)", desc: "Gemini Flash, you pay" },
            ].map(opt => (
              <div key={opt.id} onClick={() => setProvider(opt.id)}
                style={{
                  background: provider === opt.id ? "#3b82f618" : "var(--surface2)",
                  border: `1px solid ${provider === opt.id ? "#3b82f6" : "var(--border)"}`,
                  borderRadius: 6, padding: "8px 10px", cursor: "pointer", transition: "all 0.15s",
                }}>
                <div style={{ fontSize: 11.5, fontWeight: 600, color: provider === opt.id ? "var(--strong)" : "var(--body)", marginBottom: 2 }}>{opt.label}</div>
                <div style={{ fontSize: 10, color: "var(--dim)" }}>{opt.desc}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Provider-specific config */}
        {isCloud(provider) && (
          <div style={{ marginBottom: 14, padding: "12px 14px", background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: 7 }}>
            <div style={{ fontSize: 9, color: "var(--dim)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>
              {providerLabel(provider)} API Key
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input type={showKey ? "text" : "password"} value={apiKey} onChange={e => { setApiKey(e.target.value); setCloudFetchResult(null); }}
                placeholder={CLOUD_PROVIDERS[provider].keyPlaceholder}
                style={{ flex: 1, background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none" }} />
              <button onClick={() => setShowKey(!showKey)}
                style={{ background: "var(--border)", border: "1px solid #334155", borderRadius: 5, padding: "6px 10px", color: "var(--dim)", fontSize: 11, cursor: "pointer" }}>
                {showKey ? "🙈" : "👁"}
              </button>
            </div>

            {/* Model selection */}
            <div style={{ marginTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 9, color: "var(--dim)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Model</div>
              <button onClick={fetchCloudModels} disabled={cloudFetching || !apiKey}
                style={{
                  background: cloudFetching ? "var(--border)" : "linear-gradient(135deg, #22c55e15, #3b82f615)",
                  border: `1px solid ${cloudFetching || !apiKey ? "#334155" : "#22c55e44"}`,
                  color: cloudFetching || !apiKey ? "var(--dim)" : "#86efac",
                  fontSize: 10, fontWeight: 600, padding: "3px 10px", borderRadius: 4,
                  cursor: cloudFetching ? "wait" : !apiKey ? "not-allowed" : "pointer",
                  display: "flex", alignItems: "center", gap: 4,
                }}>
                {cloudFetching ? (<><span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> Loading…</>) : "↻ Load available models"}
              </button>
            </div>

            {cloudModels && cloudModels.length > 0 ? (
              <select value={cloudModel} onChange={e => setCloudModel(e.target.value)}
                style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none", cursor: "pointer" }}>
                {!cloudModels.includes(cloudModel) && <option value={cloudModel}>{cloudModel} (not in list)</option>}
                {cloudModels.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            ) : (
              <select value={cloudModel} onChange={e => setCloudModel(e.target.value)}
                style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none", cursor: "pointer" }}>
                {!FALLBACK_CLOUD_MODELS[provider].includes(cloudModel) && <option value={cloudModel}>{cloudModel}</option>}
                {FALLBACK_CLOUD_MODELS[provider].map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            )}

            {cloudFetchResult && (
              <div style={{
                marginTop: 6, padding: "5px 9px",
                background: cloudFetchResult.ok ? "#22c55e0a" : "#f59e0b12",
                border: `1px solid ${cloudFetchResult.ok ? "#22c55e33" : "#f59e0b44"}`,
                borderRadius: 5,
                fontSize: 10, color: cloudFetchResult.ok ? "#86efac" : "#fbbf24", lineHeight: 1.4,
              }}>
                {cloudFetchResult.ok ? "✓ " : "⚠ "}{cloudFetchResult.msg}
              </div>
            )}

            <div style={{ marginTop: 8, padding: "8px 10px", background: "#f59e0b0a", border: "1px solid #f59e0b22", borderRadius: 5 }}>
              <div style={{ fontSize: 10.5, color: "var(--warn)", fontWeight: 700, marginBottom: 3 }}>🔒 How your key is handled</div>
              <ul style={{ fontSize: 10, color: "var(--body)", lineHeight: 1.55, margin: 0, paddingLeft: 14 }}>
                <li>Saved in this browser's <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--warn)" }}>localStorage</code> (persists across sessions, so you won't need to re-enter it).</li>
                <li>Sent <strong>directly</strong> from your browser to {providerLabel(provider)} over HTTPS. No server of ours in between.</li>
                <li>Not encrypted. Anyone with physical access to this device, malicious browser extensions, or the same browser profile can read it. Standard <code style={{ fontFamily: "'JetBrains Mono', monospace", color: "var(--warn)" }}>localStorage</code> behavior.</li>
                <li>Use "Clear all data" below to remove it anytime.</li>
              </ul>
            </div>
            <div style={{ fontSize: 10, color: "var(--dim)", marginTop: 8 }}>
              Get a key:{" "}
              <a href={CLOUD_PROVIDERS[provider].keyUrl}
                target="_blank" rel="noopener noreferrer" style={{ color: "var(--info)", textDecoration: "none" }}>
                {CLOUD_PROVIDERS[provider].keyHost} ↗
              </a>
              {" · "}
              Pricing varies by model
            </div>
          </div>
        )}

        {provider === "ollama" && (
          <div style={{ marginBottom: 14, padding: "12px 14px", background: "var(--surface2)", border: "1px solid var(--border)", borderRadius: 7 }}>
            {/* Surfaced before the user hits "Test connection", so a setup that
                cannot possibly work says so up front. */}
            {(() => {
              const env = ollamaEnvironmentIssue(ollamaUrl);
              if (!env) return null;
              const c = env.blocking ? "#ef4444" : "#f59e0b";
              return (
                <div style={{ marginBottom: 11, padding: "9px 11px", background: c + "0d", border: `1px solid ${c}44`, borderRadius: 6, display: "flex", gap: 8, alignItems: "flex-start" }}>
                  <span style={{ fontSize: 13, flexShrink: 0, color: c }}>{env.blocking ? "⛔" : "⚠"}</span>
                  <div style={{ fontSize: 11, lineHeight: 1.55 }}>
                    <div style={{ color: c, fontWeight: 700, marginBottom: 2 }}>{env.title}</div>
                    <div style={{ color: "var(--dim)" }}>{env.msg}</div>
                  </div>
                </div>
              );
            })()}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 9, color: "var(--dim)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Ollama Server URL</div>
              <button onClick={testConnection} disabled={testing}
                style={{
                  background: testing ? "var(--border)" : "linear-gradient(135deg, #22c55e15, #3b82f615)",
                  border: `1px solid ${testing ? "#334155" : "#22c55e44"}`,
                  color: testing ? "var(--dim)" : "#86efac",
                  fontSize: 10, fontWeight: 600, padding: "3px 10px",
                  borderRadius: 4, cursor: testing ? "wait" : "pointer",
                  display: "flex", alignItems: "center", gap: 4,
                }}>
                {testing ? (<><span style={{ display: "inline-block", animation: "spin 1s linear infinite" }}>◌</span> Testing…</>) : "↻ Test connection"}
              </button>
            </div>
            <input type="text" value={ollamaUrl} onChange={e => { setOllamaUrl(e.target.value); setTestResult(null); }}
              style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none", marginBottom: 10 }} />

            {testResult && (
              <div style={{
                marginTop: -4, marginBottom: 10, padding: "6px 9px",
                background: testResult.ok ? "#22c55e0a" : "#ef444412",
                border: `1px solid ${testResult.ok ? "#22c55e33" : "#ef444444"}`,
                borderRadius: 5,
                fontSize: 10.5, color: testResult.ok ? "#86efac" : "#fca5a5", lineHeight: 1.4,
              }}>
                {testResult.ok ? "✓ " : "✗ "}{testResult.msg}
              </div>
            )}

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 9, color: "var(--dim)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>Model</div>
              {availableModels && availableModels.length > 0 && (
                <span style={{ fontSize: 9, color: "var(--dim)" }}>{availableModels.length} installed</span>
              )}
            </div>

            {availableModels && availableModels.length > 0 ? (
              <select value={ollamaModel} onChange={e => setOllamaModel(e.target.value)}
                style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none", cursor: "pointer" }}>
                {!availableModels.includes(ollamaModel) && <option value={ollamaModel}>{ollamaModel} (not installed)</option>}
                {availableModels.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            ) : (
              <input type="text" value={ollamaModel} onChange={e => setOllamaModel(e.target.value)}
                placeholder="qwen2.5:7b, llama3.2, mistral, ..."
                style={{ width: "100%", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 5, padding: "7px 10px", color: "var(--text)", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", outline: "none" }} />
            )}

            <div style={{ marginTop: 8, padding: "6px 9px", background: "#22c55e0a", border: "1px solid #22c55e22", borderRadius: 5 }}>
              <div style={{ fontSize: 10, color: "var(--ok)", lineHeight: 1.5 }}>
                🦙 <strong>Recommended:</strong> <code style={{ fontFamily: "'JetBrains Mono', monospace" }}>ollama pull qwen2.5:7b</code>.
                Run Ollama with <code style={{ fontFamily: "'JetBrains Mono', monospace" }}>OLLAMA_ORIGINS="*"</code> so the browser can reach it.
              </div>
            </div>
            <div style={{ marginTop: 6, padding: "6px 9px", background: "#3b82f60a", border: "1px solid #3b82f622", borderRadius: 5 }}>
              <div style={{ fontSize: 10, color: "var(--info)", lineHeight: 1.5 }}>
                💡 <strong>Auto-enhanced prompting:</strong> Ollama mode uses few-shot examples to guide smaller local models toward AI-native attack scenarios (MLOps, RAG, LLM-specific), not generic IT attacks.
              </div>
            </div>

            {/* ADVANCED TUNING (collapsible) */}
            <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--border)" }}>
              <button onClick={() => setShowAdvanced(!showAdvanced)}
                style={{
                  background: "none", border: "none", color: "var(--dim)",
                  fontSize: 10.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1,
                  cursor: "pointer", padding: 0, display: "flex", alignItems: "center", gap: 6, width: "100%",
                }}>
                <span style={{ transition: "transform 0.2s", transform: showAdvanced ? "rotate(90deg)" : "rotate(0deg)", display: "inline-block" }}>▸</span>
                Advanced Tuning
                {!showAdvanced && <span style={{ fontSize: 9, color: "var(--dim)", fontWeight: 500, textTransform: "none", letterSpacing: 0 }}>temperature, top_p, context</span>}
              </button>

              {showAdvanced && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 10, animation: "fadeIn 0.2s ease" }}>
                  {/* Temperature */}
                  <TuningSlider
                    label="Temperature"
                    value={temperature}
                    onChange={setTemperature}
                    min={0} max={2} step={0.1}
                    hint="Lower = more deterministic (0.3-0.6 good for JSON). Higher = more creative."
                    default={OLLAMA_DEFAULTS.temperature}
                  />
                  {/* Top P */}
                  <TuningSlider
                    label="Top P"
                    value={topP}
                    onChange={setTopP}
                    min={0} max={1} step={0.05}
                    hint="Nucleus sampling. 0.9 = balanced. Lower = safer vocabulary."
                    default={OLLAMA_DEFAULTS.topP}
                  />
                  {/* Num Context */}
                  <TuningSlider
                    label="Num Context"
                    value={numCtx}
                    onChange={setNumCtx}
                    min={2048} max={32768} step={1024}
                    hint="Max tokens the model can read. 8192 fits the ATLAS data + example. Bigger = more VRAM."

function TechCard({ tech, color, isSelected, onClick, idx, isHighlighted, dimmed, classic }) {
  const [hovered, setHovered] = useState(false);
  const num = tech.id.replace("AML.T", "");
  const hasSubs = tech.subs && tech.subs.length > 0;
  const isActive = hovered && !isSelected;
  const glowing = isHighlighted && !isSelected;
  const mat = MATURITY[tech.maturity];

  // Dynamic font sizing based on name length to prevent overflow on hover
  const nameLen = tech.name.length;
  // Find longest single word, breaks on hyphens/slashes/spaces
  const longestWord = tech.name.split(/[\s\-\/]/).reduce((m, w) => w.length > m ? w.length : m, 0);

  let hoverNameSize = 12;
  if (nameLen > 40 || longestWord > 14) hoverNameSize = 10;
  else if (nameLen > 30 || longestWord > 12) hoverNameSize = 10.5;
  else if (nameLen > 22) hoverNameSize = 11;

  return (
    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
      style={{
        background: isSelected ? color.border + "28" : glowing ? color.border + "30" : isActive ? color.border + "22" : tileFill(color),
        border: `${isActive ? 2 : 1.5}px solid ${isSelected || isActive || glowing ? color.border : color.border + "40"}`,
        borderRadius: 6,
        padding: isActive ? "10px 12px" : "7px 9px",
        cursor: "pointer",
        minHeight: isActive ? 76 : 56,
        display: "flex", flexDirection: "column", justifyContent: "space-between",
        // Classic view drops the looping pulse: a chain being explained on a
        // projector should hold still. Hover feedback is kept either way.
        animation: glowing
          ? (classic ? "none" : "pathPulse 1.5s ease infinite")
          : `fadeIn 0.25s ease ${idx * 0.015}s both`,
        boxShadow: isSelected
          ? `0 0 14px ${color.glow}, inset 0 0 18px ${color.glow}`
          : glowing
          ? `0 0 16px ${color.border}44, 0 0 30px ${color.border}22`
          : isActive
          ? `0 0 18px ${color.border}55, 0 8px 26px rgba(0,0,0,0.55), inset 0 0 20px ${color.glow}`
          : "none",
        position: "relative",
        zIndex: isActive ? 10 : isSelected ? 5 : glowing ? 4 : 1,
        transform: isActive ? "scale(1.22)" : isSelected ? "scale(1.03)" : glowing ? "scale(1.05)" : "scale(1)",
        transformOrigin: "center center",
        overflow: "hidden",
        opacity: dimmed && !isSelected ? 0.2 : 1,
        transition: "transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), min-height 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), padding 0.22s ease, border-color 0.15s ease, border-width 0.15s ease, box-shadow 0.2s ease, background 0.15s ease, opacity 0.2s ease",
      }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 3 }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
          {/* Evidence grade at a glance: red = observed in a real incident. */}
          {mat && <span title={`${tech.maturity}: ${mat.desc}`}
            style={{ width: isActive ? 6 : 5, height: isActive ? 6 : 5, borderRadius: "50%", background: mat.color, flexShrink: 0, transition: "all 0.2s ease" }} />}
          <span style={{ fontSize: isActive ? 12 : 10, color: inkFor(color.border), fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, letterSpacing: 0.3, transition: "font-size 0.2s ease" }}>T{num}</span>
        </span>
        {hasSubs && <span style={{ fontSize: isActive ? 8.5 : 7, background: color.border + "28", color: inkFor(color.border), padding: isActive ? "2px 6px" : "1px 4px", borderRadius: 3, fontWeight: 700, lineHeight: isActive ? "16px" : "14px", transition: "all 0.2s ease" }}>{tech.subs.length}</span>}
        {glowing && <span style={{ fontSize: 7, background: "#ff475744", color: "var(--bad)", padding: "1px 4px", borderRadius: 3, fontWeight: 700, lineHeight: "14px" }}>PATH</span>}
      </div>
      <div style={{
        fontSize: isActive ? hoverNameSize : 11,
        color: isActive ? "var(--strong)" : glowing ? "var(--strong)" : "var(--text)",
        fontWeight: isActive || glowing ? 600 : 500,

        letterSpacing: -0.2,
        marginTop: isActive ? 4 : 2,

      }}>{tech.name}</div>
    </div>
  );
}

// === DOCUMENTED INCIDENTS ===
// Everything below renders recorded ATLAS case-study data. No model is involved
// on this path, which is the point of it.

const MONTHS = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];

// MITRE records how precisely each date is known. Printing a day when only the
// year was recorded would be inventing precision, so granularity is honoured.
function formatIncidentDate(date, granularity) {
  const p = (date || "").split("-");
  if (!p[0]) return date || "unknown";
  if (granularity === "Year" || p.length < 2) return p[0];
  const mon = MONTHS[parseInt(p[1], 10) - 1] || "";
  if (granularity === "Month" || p.length < 3) return `${mon} ${p[0]}`;
  return `${parseInt(p[2], 10)} ${mon} ${p[0]}`;
}

  Incident: { color: "#ef4444", label: "REAL INCIDENT", desc: "A documented real-world incident" },
  Exercise: { color: "#f59e0b", label: "EXERCISE", desc: "Published research or a red-team exercise, not a real-world breach" },
};

}

}

function DetailPanel({ tech, tacticName, tacticId, color, onClose, highlightedTechs, setHighlightedTechs, config, onOpenSettings, techMitigations, techIncidents, onOpenIncident }) {
  const [sim, setSim] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const num = tech.id.replace("AML.T", "");
  const aiEnabled = config.provider && config.provider !== "none";
  const mat = MATURITY[tech.maturity];
  const [showAllIncidents, setShowAllIncidents] = useState(false);
  const realCount = (techIncidents || []).filter(c => c.type === "Incident").length;
  // A technique can serve several tactics; the panel is opened in the context
  // of one, so name the others rather than hiding them.
  const otherTactics = (tech.tactics || [])
    .filter(id => id !== tacticId)
    .map(id => ATLAS_DATA.tactics.find(t => t.id === id))
    .filter(Boolean);

  const handleSimulate = useCallback(async () => {
    setLoading(true); setError(null); setSim(null); setHighlightedTechs([]);
    try {
      let result = await runSimulation(tech, ATLAS_DATA.techniques, ATLAS_DATA.tactics, config, techMitigations || [], tacticId);
      let pathIds = (result.attack_path || []).map(s => s.technique_id);

      // Hard-enforcement: the selected technique MUST be in the path.
      // Local models (even good ones) often ignore this rule. We retry once with
      // a stricter prompt, then auto-inject + flag if it still fails.
      const techInPath = pathIds.some(id => id === tech.id || id.startsWith(tech.id + "."));
      if (!techInPath) {
        console.warn(`[ATLAS] Selected technique ${tech.id} missing from generated path. Retrying…`);
        try {
          // Retry with stricter config (lower temp for more compliant output)
          const retryConfig = { ...config, temperature: 0.3 };
          result = await runSimulation(tech, ATLAS_DATA.techniques, ATLAS_DATA.tactics, retryConfig, techMitigations || [], tacticId);
          pathIds = (result.attack_path || []).map(s => s.technique_id);
        } catch (e) {
          console.warn("[ATLAS] Retry failed, keeping original result.", e);
        }

        // Check again after retry
        const stillMissing = !pathIds.some(id => id === tech.id || id.startsWith(tech.id + "."));
        if (stillMissing) {
          // Inject the selected technique at a sensible position based on its tactic.
          // Tactics list is already in kill-chain order, so we position by tactic index.
          const tacticOrder = ATLAS_DATA.tactics.map(t => t.id);
          const targetTacticIdx = tech.tactics && tech.tactics.length > 0
            ? tacticOrder.indexOf(tech.tactics[0])
            : -1;

          const injected = {
            tactic_id: tech.tactics?.[0] || "AML.TA0005",
            technique_id: tech.id,
            technique_name: tech.name,
            step_description: `Attacker leverages ${tech.name.toLowerCase()} as part of the attack (auto-inserted, because the model did not include this technique in its generated path).`,
          };

          // Find the right insertion index based on kill-chain order
          const path = [...(result.attack_path || [])];
          let insertIdx = path.length; // default: end
          for (let i = 0; i < path.length; i++) {
            const stepTacticIdx = tacticOrder.indexOf(path[i].tactic_id);
            if (stepTacticIdx > targetTacticIdx) { insertIdx = i; break; }
          }
          path.splice(insertIdx, 0, injected);
          result = { ...result, attack_path: path, _autoInjected: true };
          pathIds = path.map(s => s.technique_id);
        } else {
          result = { ...result, _retrySucceeded: true };
        }
      }

      // Post-processing: fix tactic placement and remove duplicates
      if (result.attack_path) {
        let path = [...result.attack_path];

        // Step 1. De-duplicate: if the selected technique appears more than once,
        // keep only the best match (correct tactic first, else first occurrence)
        const techStepIndices = path.reduce((acc, step, i) => {
          if (step.technique_id === tech.id || step.technique_id?.startsWith(tech.id + ".")) acc.push(i);
          return acc;
        }, []);
        if (techStepIndices.length > 1) {
          const keepIdx = techStepIndices.find(i => path[i].tactic_id === tacticId) ?? techStepIndices[0];
          path = path.filter((_, i) => !techStepIndices.includes(i) || i === keepIdx);
        }

        // Step 2. Tactic correction: if the kept step is under the wrong tactic, relabel it
        let tacticCorrected = false;
        if (tacticId) {
          path = path.map(step => {
            if ((step.technique_id === tech.id || step.technique_id?.startsWith(tech.id + ".")) && step.tactic_id !== tacticId) {
              tacticCorrected = true;
              return { ...step, tactic_id: tacticId, _tacticCorrected: true };
            }
            return step;
          });
        }

        result = { ...result, attack_path: path, ...(tacticCorrected && { _tacticCorrected: true }) };
      }

      setSim(result);
      setHighlightedTechs(pathIds);
    } catch (e) {
      setError(e.message || "Simulation failed, try again.");
      console.error(e);
    }
    setLoading(false);
  }, [tech, tacticId, techMitigations, setHighlightedTechs, config]);

  return (
    <div style={{
      position: "fixed", bottom: 0, left: 0, right: 0,
      background: "linear-gradient(to top, var(--bg3), var(--surface))",
      borderTop: `2px solid ${color.border}`,
      padding: "16px 24px", zIndex: 1000, animation: "slideUp 0.2s ease",
      boxShadow: `0 -6px 30px rgba(0,0,0,0.6), 0 -2px 12px ${color.glow}`,

      <div style={{ maxWidth: 1400, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 5 }}>

              <span style={{ fontSize: 20, color: "var(--strong)", fontWeight: 700, letterSpacing: -0.3 }}>{tech.name}</span>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 7, flexWrap: "wrap" }}>
              <span style={{ fontSize: 12, background: color.border + "18", color: inkFor(color.border), padding: "3px 11px", borderRadius: 4, fontWeight: 600, border: `1px solid ${chipEdge(color.border, "33")}` }}>{tacticName}</span>
              <span style={{ fontSize: 12, color: "var(--dim)", fontFamily: "'JetBrains Mono', monospace" }}>{tech.id}</span>
              {mat && (
                <span title={mat.desc}
                  style={{ fontSize: 10, background: mat.color + "18", color: inkFor(mat.color), padding: "3px 9px", borderRadius: 4, fontWeight: 700, border: `1px solid ${chipEdge(mat.color, "44")}`, fontFamily: "'JetBrains Mono', monospace", letterSpacing: 0.4, cursor: "help" }}>
                  {mat.short}
                </span>
              )}
              {(tech.platforms || []).map(p => (
                <span key={p} title={`Applies to ${p} systems`}
                  style={{ fontSize: 9.5, background: (PLATFORMS[p] || "var(--dim)") + "14", color: PLATFORMS[p] || "var(--dim)", padding: "3px 8px", borderRadius: 4, fontWeight: 600, border: `1px solid ${chipEdge(PLATFORMS[p] || "#64748b", "33")}` }}>
                  {p}
                </span>
              ))}
              {tech.attack && (
                <a href={`https://attack.mitre.org/techniques/${tech.attack.replace(".", "/")}/`} target="_blank" rel="noopener noreferrer"
                  title="Corresponding technique in MITRE ATT&CK Enterprise"
                  style={{ fontSize: 9.5, background: "#94a3b814", color: "var(--dim)", padding: "3px 8px", borderRadius: 4, fontWeight: 600, border: `1px solid ${chipEdge("#94a3b8", "33")}`, textDecoration: "none", fontFamily: "'JetBrains Mono', monospace" }}>
                  ATT&CK {tech.attack} ↗
                </a>
              )}
            </div>
            {otherTactics.length > 0 && (
              <div style={{ fontSize: 11, color: "var(--dim)", marginBottom: 7 }}>

              </div>
            )}
            {tech.desc && (

                  padding: "6px 14px", borderRadius: 6, cursor: loading ? "wait" : "pointer",
                  display: "flex", alignItems: "center", gap: 6,
                  transition: "all 0.2s", letterSpacing: 0.3,
                }}
                onMouseEnter={e => { if (!loading) { e.currentTarget.style.background = "linear-gradient(135deg, #f59e0b33, #ef444433)"; e.currentTarget.style.borderColor = "#f59e0b"; }}}
                onMouseLeave={e => { if (!loading) { e.currentTarget.style.background = "linear-gradient(135deg, #f59e0b22, #ef444422)"; e.currentTarget.style.borderColor = "#f59e0b66"; }}}
              >
                {loading ? (<><span style={{ display: "inline-block", animation: "spin 1s linear infinite", fontSize: 13 }}>◌</span> Simulating...</>) : (<>⚡ Attack Simulation</>)}
              </button>

        {/* Simulation Result */}

        {sim && <SimPanel sim={sim} color={color} tech={tech} onClose={() => { setSim(null); setHighlightedTechs([]); }} />}
      </div>
    </div>
  );
}

// === CIRCUIT BACKGROUND ===
function CircuitBackground() {
  const canvasRef = useRef(null);
  const animRef   = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    // ── resize ──────────────────────────────────────────────────────────────
    const resize = () => {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    // ── palette ─────────────────────────────────────────────────────────────
    const COLORS = [
      { line: "rgba(59,130,246,0.18)",  orb: "#3b82f6",  glow: "rgba(59,130,246,0.55)"  },
      { line: "rgba(139,92,246,0.15)",  orb: "#8b5cf6",  glow: "rgba(139,92,246,0.50)"  },
      { line: "rgba(6,182,212,0.14)",   orb: "#06b6d4",  glow: "rgba(6,182,212,0.50)"   },
      { line: "rgba(236,72,153,0.12)",  orb: "#ec4899",  glow: "rgba(236,72,153,0.45)"  },
    ];

    // ── grid helper ──────────────────────────────────────────────────────────
    const STEP = 64;  // grid cell size

    function buildGrid() {
      const cols = Math.ceil(canvas.width  / STEP) + 1;
      const rows = Math.ceil(canvas.height / STEP) + 1;

      // For each column pick a random subset of rows where a horizontal segment exists,
      // and for each row a random subset of columns where a vertical segment exists.
      const hSegs = []; // { x1, y1, x2, y2 }
      const vSegs = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols - 1; c++) {
          if (Math.random() < 0.32) {
            hSegs.push({ x1: c * STEP, y: r * STEP, x2: (c + 1) * STEP });
          }
        }
      }
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows - 1; r++) {
          if (Math.random() < 0.32) {
            vSegs.push({ x: c * STEP, y1: r * STEP, y2: (r + 1) * STEP });
          }
        }
      }
      return { hSegs, vSegs, cols, rows };
    }

    let grid = buildGrid();
    window.addEventListener("resize", () => { grid = buildGrid(); });

    // ── draw wires ───────────────────────────────────────────────────────────
    function drawWires() {
      const { hSegs, vSegs } = grid;
      // horizontal
      hSegs.forEach(s => {
        const col = COLORS[Math.floor((s.x1 / STEP + s.y / STEP) % COLORS.length)];
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y);
        ctx.lineTo(s.x2, s.y);
        ctx.strokeStyle = col.line;
        ctx.lineWidth   = 0.8;
        ctx.stroke();
      });
      // vertical
      vSegs.forEach(s => {
        const col = COLORS[Math.floor((s.x / STEP + s.y1 / STEP) % COLORS.length)];
        ctx.beginPath();
        ctx.moveTo(s.x, s.y1);
        ctx.lineTo(s.x, s.y2);
        ctx.strokeStyle = col.line;
        ctx.lineWidth   = 0.8;
        ctx.stroke();
      });
    }

    // ── node dots at intersections ───────────────────────────────────────────
    function drawNodes() {
      const { cols, rows, hSegs, vSegs } = grid;
      // Only draw a dot where an H and V segment visibly meet
      const hSet = new Set(hSegs.map(s => `${s.x1},${s.y}`));
      const vSet = new Set(vSegs.map(s => `${s.x},${s.y1}`));
      for (let r = 0; r <= rows; r++) {
        for (let c = 0; c <= cols; c++) {
          const x = c * STEP, y = r * STEP;
          // Check neighbour presence (simplified – just draw 15 % of grid intersections)
          if (Math.random() < 0.15) {
            const col = COLORS[(c + r) % COLORS.length];
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = col.orb;
            ctx.globalAlpha = 0.35;
            ctx.fill();
            ctx.globalAlpha = 1;
          }
        }
      }
    }

    // ── orb class ────────────────────────────────────────────────────────────
    class Orb {
      constructor() { this.reset(true); }

      reset(cold) {
        const { hSegs, vSegs } = grid;
        const useH = Math.random() < 0.5;
        const segs  = useH ? hSegs : vSegs;
        if (!segs.length) { this._dead = true; return; }
        this._dead = false;
        const seg   = segs[Math.floor(Math.random() * segs.length)];
        this.horiz  = useH;
        if (useH) {
          this.x  = cold ? seg.x1 + Math.random() * (seg.x2 - seg.x1) : seg.x1;
          this.y  = seg.y;
          this.tx = seg.x2;
          this.ty = seg.y;
        } else {
          this.x  = seg.x;
          this.y  = cold ? seg.y1 + Math.random() * (seg.y2 - seg.y1) : seg.y1;
          this.tx = seg.x;
          this.ty = seg.y2;
        }
        const col    = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.color   = col.orb;
        this.glow    = col.glow;
        this.speed   = 0.06 + Math.random() * 0.08;
        this.radius  = 2.2 + Math.random() * 1.8;
        this.trail   = [];
        this.maxTrail = 18 + Math.floor(Math.random() * 14);
        this.alpha   = 0.55 + Math.random() * 0.45;
      }

      update() {
        if (this._dead) return;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) this.trail.shift();

        const dx = this.tx - this.x;
        const dy = this.ty - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < this.speed + 0.5) {
          this.reset(false);
        } else {
          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;
        }
      }

      draw() {
        if (this._dead) return;
        // trail
        const tl = this.trail.length;
        this.trail.forEach((pt, i) => {
          const t = i / tl;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, this.radius * 0.55 * t, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = t * this.alpha * 0.45;
          ctx.fill();
        });

        // outer glow
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 3.2, 0, Math.PI * 2);
        ctx.fillStyle = this.glow;
        ctx.globalAlpha = this.alpha * 0.22;
        ctx.fill();

        // core
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.fill();

        // specular highlight
        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.28, this.y - this.radius * 0.28, this.radius * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.globalAlpha = 0.45;
        ctx.fill();

        ctx.globalAlpha = 1;
      }
    }

    const ORB_COUNT = 5;
    const orbs = Array.from({ length: ORB_COUNT }, () => new Orb());

    // ── animation loop ───────────────────────────────────────────────────────
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawWires();
      // drawNodes(); // optional subtle dots, disable for cleaner look
      orbs.forEach(o => { o.update(); o.draw(); });
      animRef.current = requestAnimationFrame(loop);
    }
    animRef.current = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener("resize", resize);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      style={{
        position: "fixed", top: 0, left: 0,
        width: "100%", height: "100%",
        pointerEvents: "none",
        zIndex: 0,
      }}
    />
  );
}

              <button onClick={() => { setPlatform(null); setRealizedOnly(false); }}
                style={{ background: "none", border: "none", color: "var(--dim2)", fontSize: 9.5, cursor: "pointer", textDecoration: "underline", padding: "3px 4px" }}>
                clear
              </button>
            )}
          </div>

          <div style={{ display: "flex", gap: 2, marginTop: 10, overflow: "auto" }}>
            {PHASES.map(g => (
              <div key={g.label} style={{ flex: g.ids.length, textAlign: "center", padding: "3px 4px", background: g.color + "0a", borderTop: `2px solid ${g.color}`, borderRadius: "3px 3px 0 0" }}>
                <span style={{ fontSize: 10, fontWeight: 700, color: inkFor(g.color), letterSpacing: 1.2, textTransform: "uppercase" }}>{g.label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Search */}
      {filter && filteredTechs && (
        <div style={{ padding: "12px 20px", borderBottom: "1px solid var(--line)", maxWidth: 1800, margin: "0 auto" }}>
          {retired && (
            <div style={{ marginBottom: 9, padding: "8px 11px", background: "#f59e0b0a", border: "1px solid #f59e0b33", borderRadius: 6, display: "flex", alignItems: "flex-start", gap: 8 }}>
              <span style={{ fontSize: 13, flexShrink: 0 }}>⧗</span>
              <div style={{ fontSize: 11.5, color: "var(--warn)", lineHeight: 1.55 }}>
                <strong>{retired.old}</strong> ({retired.name}) was retired in ATLAS v{retired.since}. It is now{" "}
                <strong>{retired.supersededBy}</strong>
                {retired.parent && <> under <strong>{retired.parent.id} {retired.parent.name}</strong></>}.
                {retired.parent && (
                  <button onClick={() => { handleSelectTech(retired.parent, retired.parent.tactics[0]); setFilter(""); }}
                    style={{ background: "none", border: "none", color: "var(--warn)", fontSize: 11.5, fontWeight: 700, textDecoration: "underline", cursor: "pointer", padding: "0 0 0 6px" }}>
                    Open it →
                  </button>
                )}
              </div>
            </div>
          )}
          <div style={{ fontSize: 11, color: "var(--dim2)", marginBottom: 8 }}><span style={{ color: "#3b82f6", fontWeight: 700 }}>{filteredTechs.length}</span> results</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
            {filteredTechs.map((tech, i) => {
              const c = TC[tech.tactics[0]] || TC["AML.TA0002"];
              return (<div key={tech.id + i} onClick={() => { handleSelectTech(tech, tech.tactics[0]); setFilter(""); }}
                style={{ background: tileFill(c), border: `1px solid ${chipEdge(c.border, "44")}`, borderRadius: 5, padding: "5px 9px", cursor: "pointer", fontSize: 10.5, color: "var(--body)", transition: "all 0.12s" }}
                onMouseEnter={e => e.currentTarget.style.borderColor = c.border} onMouseLeave={e => e.currentTarget.style.borderColor = c.border + "44"}>
                <span style={{ color: inkFor(c.border), fontFamily: "'JetBrains Mono',monospace", fontSize: 8.5, marginRight: 5 }}>{tech.id}</span>{tech.name}
              </div>);
            })}
          </div>
        </div>
      )}

      {/* Matrix */}
      <div style={{ overflowX: "auto", padding: "0 20px 140px", maxWidth: 1800, margin: "0 auto" }}>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${ATLAS_DATA.tactics.length}, minmax(108px, 1fr))`, gap: 3, paddingTop: 6 }}>
          {ATLAS_DATA.tactics.map((tactic, ti) => {
            const color = TC[tactic.id];
            const cnt = techsByTactic[tactic.id]?.length || 0;
            const isFirst = ti === 0;
            const isLast = ti === ATLAS_DATA.tactics.length - 1;
            // Align tooltip edge to tactic header edge at the extremes to avoid viewport clipping
            const tooltipAlign = isFirst
              ? { left: 0, transform: "none" }
              : isLast
              ? { right: 0, left: "auto", transform: "none" }
              : { left: "50%", transform: "translateX(-50%)" };
            return (
              <div key={tactic.id} style={{ background: theme === "classic" ? color.border + "1a" : `linear-gradient(180deg, ${color.border}15 0%, ${color.bg} 100%)`, borderTop: `3px solid ${color.border}`, borderRadius: "5px 5px 0 0", padding: "8px 6px 7px", textAlign: "center", cursor: "default", animation: `fadeIn 0.25s ease ${ti * 0.03}s both`, position: "relative", zIndex: hoveredTactic === tactic.id ? 60 : 1 }}
                onMouseEnter={() => setHoveredTactic(tactic.id)} onMouseLeave={() => setHoveredTactic(null)}>
                <div style={{ fontSize: 9, fontFamily: "'JetBrains Mono',monospace", color: inkFor(color.border), fontWeight: 600, marginBottom: 2, opacity: 0.75 }}>{tactic.id}</div>
                <div style={{ fontSize: 11.5, fontWeight: 700, color: "var(--text)", lineHeight: 1.15, marginBottom: 3 }}>{tactic.name}</div>
                <div style={{ fontSize: 9, color: inkFor(color.border), fontWeight: 600, opacity: 0.6 }}>{cnt} technique{cnt !== 1 ? "s" : ""}</div>
                {hoveredTactic === tactic.id && (
                  <div style={{ position: "absolute", top: "calc(100% + 4px)", ...tooltipAlign, background: "var(--tooltip)", border: `1px solid ${chipEdge(color.border, "33")}`, borderRadius: 6, padding: "8px 11px", width: 220, zIndex: 100, boxShadow: "0 8px 24px rgba(0,0,0,0.5)", fontSize: 10.5, color: "var(--dim)", lineHeight: 1.4, textAlign: "left", backdropFilter: "blur(6px)" }}>
                    {tactic.desc}
                  </div>
                )}
              </div>
            );
          })}

          {ATLAS_DATA.tactics.map(tactic => {
            const color = TC[tactic.id];
            const techs = techsByTactic[tactic.id] || [];
            return (
              <div key={tactic.id + "-col"} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                {techs.map((tech, ti) => (
                  <TechCard key={tech.id + tactic.id} tech={tech} color={color} idx={ti} tacticId={tactic.id}
                    isSelected={selectedTech?.id === tech.id && selectedTactic === tactic.id}
                    isHighlighted={highlightedTechs.includes(tech.id)}
                    dimmed={isDimmed(tech)} classic={theme === "classic"}
                    onClick={() => handleSelectTech(tech, tactic.id)} />
                ))}
              </div>
            );
          })}
        </div>
      </div>

      {/* Legend - stays fixed at bottom-right, fades out when panel opens */}
      <div style={{
        position: "fixed",
        bottom: 10,
        right: 14,
        background: "var(--surface-a)",
        border: "1px solid var(--border2)",
        borderRadius: 7,
        padding: "8px 12px",
        zIndex: 99,
        backdropFilter: "blur(6px)",
        opacity: selectedTech ? 0 : 1,
        pointerEvents: selectedTech ? "none" : "auto",
        transition: "opacity 0.2s ease",
      }}>
        <div style={{ fontSize: 8, color: "var(--dim2)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>Legend</div>
        {[
          { c: "#3b82f6", l: "Click card → details" },
          { c: "#f59e0b", l: "⚡ Simulate → AI attack path" },
          { c: "#ff4757", l: "PATH = highlighted kill chain" },
        ].map(({ c, l }) => (
          <div key={l} style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 2 }}>
            <span style={{ width: 6, height: 6, borderRadius: 1, background: c, flexShrink: 0 }} />
            <span style={{ fontSize: 9, color: "var(--dim)" }}>{l}</span>
          </div>
        ))}
      </div>

      {/* Source credit + QR code - fixed bottom-left, fades when panel opens */}
      <div style={{
        position: "fixed",
        bottom: 14,
        left: 14,
        zIndex: 99,
        opacity: selectedTech ? 0 : 1,

        transition: "opacity 0.3s ease",
        display: "flex",
        alignItems: "flex-end",
        gap: 12,

// The dataset is inflated before the first render, so every component can keep
// treating ATLAS_DATA as if it were a plain constant.
async function bootstrap() {
  const root = document.getElementById('root');
  try {
    ATLAS_DATA = await loadAtlasData();
    MITIGATIONS_DATA = ATLAS_DATA.mitigations;
    ATLAS_DATA.techniques.forEach(t => {
      TECH_INDEX[t.id] = { name: t.name, parent: t.id };
      (t.subs || []).forEach(sub => {
        TECH_INDEX[sub.id] = { name: t.name + ': ' + sub.name, parent: t.id };
      });
    });
    ReactDOM.createRoot(root).render(<ATLASMatrix />);
  } catch (e) {
    console.error('[ATLAS] Failed to load the embedded dataset.', e);
    // Built with DOM nodes rather than innerHTML: the detail line interpolates an
    // error message, and this page holds an API key in localStorage, so it should
    // not contain a single HTML-injection sink even one fed by browser-generated text.
    const box = document.createElement('div');
    box.style.cssText = 'font:14px/1.6 system-ui;color:#fca5a5;background:#1a0d0d;'
      + 'border:1px solid #7f1d1d;border-radius:8px;padding:18px 22px;margin:40px auto;max-width:640px';
    const head = document.createElement('strong');
    head.textContent = 'Could not load the ATLAS dataset.';
    const body = document.createElement('div');
    body.textContent = 'This page needs a browser with DecompressionStream support '
      + '(Chrome 80+, Edge 80+, Firefox 113+, Safari 16.4+).';
    const detail = document.createElement('div');
    detail.style.cssText = 'color:#9ca3af;font-size:12.5px;margin-top:6px';
    detail.textContent = (e && e.message) ? e.message : String(e);
    box.append(head, body, detail);
    root.replaceChildren(box);
  }
}

bootstrap();
</script>
</body>
</html>
